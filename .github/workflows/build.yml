name: Deploy React to GitHub Pages

on:
  push:
    branches: [ main ]


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout kod
        uses: actions/checkout@v7

      - name: Sätt upp Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Installera beroenden
        run: npm ci

      - name: Bygg projektet
        run: npm run build
        env:
          VITE_BASE_URL: /MU25_react_deploy/

      - name: Ladda upp dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
        pages: write
        id-token: write

    steps:
      - name: Deploya till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  render-deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Trigga Render deploy
        run: curl -X POST ${{secrets.RENDER_DEPLOY_HOOK}}